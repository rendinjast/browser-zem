[package]
name = "zem-addon-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
zem-addon-protocol = { path = "../zem-addon-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "fs", "time"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
base64 = "0.22"
libc = "0.2"
