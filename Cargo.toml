[workspace]
resolver = "2"
members = [
    "browser",
    "crates/zem-addon-sdk",
    "crates/zem-addon-protocol",
]

# Workspace-inherited dependencies used by the vendored zem-addon-protocol
# crate (kept in sync with the zem monorepo's workspace.dependencies).
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "fs", "time", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
